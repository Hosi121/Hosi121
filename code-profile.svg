<svg xmlns="http://www.w3.org/2000/svg" width="480" height="418" viewBox="0 0 480 418" role="img" aria-labelledby="title desc">
  <title id="title">Languages and code changes</title>
  <desc id="desc">Most used programming languages and code changes over the last 12 months for Hosi121.</desc>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: #57606a; }
    .heading { fill: #0969da; font-size: 16px; font-weight: 400; }
    .eyebrow { fill: #8c959f; font-size: 10px; font-weight: 600; letter-spacing: .08em; }
    .muted { fill: #6e7781; font-size: 11px; }
    .label { fill: #24292f; font-size: 12px; }
    .value { fill: #24292f; font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 12px; font-weight: 600; }
    .metric-label { fill: #6e7781; font-size: 10px; }
    .metric-value { fill: #24292f; font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 20px; font-weight: 600; }
    .added { fill: #1a7f37; }
    .deleted { fill: #cf222e; }
  </style>

  <rect width="480" height="418" rx="6" fill="#ffffff"/>

  <g transform="translate(18 18)">
    <circle cx="9" cy="9" r="8" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="9" y="13" text-anchor="middle" fill="#0969da" font-size="10" font-weight="700">&lt;/&gt;</text>
    <text class="heading" x="26" y="14">Code profile</text>
    <text class="muted" x="0" y="32">languages &amp; momentum · last 12 months</text>
  </g>

  <g transform="translate(18 70)">
    <text class="eyebrow" x="0" y="0">MOST USED LANGUAGES</text>

    <rect x="0" y="14" width="444" height="14" rx="7" fill="#f0f3f6"/>
    <path d="M7 14h282.9v14H7a7 7 0 0 1 0-14Z" fill="#3178c6"/>
    <rect x="289.9" y="14" width="40.4" height="14" fill="#3572A5"/>
    <rect x="330.3" y="14" width="38.2" height="14" fill="#f34b7d"/>
    <rect x="368.5" y="14" width="14.2" height="14" fill="#e34c26"/>
    <rect x="382.7" y="14" width="14.2" height="14" fill="#00ADD8"/>
    <rect x="396.9" y="14" width="11.5" height="14" fill="#f1e05a"/>
    <rect x="408.4" y="14" width="11.1" height="14" fill="#b07219"/>
    <path d="M419.5 14H455a7 7 0 0 1 0 14h-35.5Z" fill="#8b949e"/>

    <g transform="translate(0 55)">
      <circle cx="5" cy="0" r="4" fill="#3178c6"/>
      <text class="label" x="16" y="4">TypeScript</text>
      <text class="value" x="214" y="4" text-anchor="end">65.1%</text>
    </g>
    <g transform="translate(252 55)">
      <circle cx="5" cy="0" r="4" fill="#3572A5"/>
      <text class="label" x="16" y="4">Python</text>
      <text class="value" x="212" y="4" text-anchor="end">9.1%</text>
    </g>

    <g transform="translate(0 80)">
      <circle cx="5" cy="0" r="4" fill="#f34b7d"/>
      <text class="label" x="16" y="4">C++</text>
      <text class="value" x="214" y="4" text-anchor="end">8.6%</text>
    </g>
    <g transform="translate(252 80)">
      <circle cx="5" cy="0" r="4" fill="#e34c26"/>
      <text class="label" x="16" y="4">HTML</text>
      <text class="value" x="212" y="4" text-anchor="end">3.2%</text>
    </g>

    <g transform="translate(0 105)">
      <circle cx="5" cy="0" r="4" fill="#00ADD8"/>
      <text class="label" x="16" y="4">Go</text>
      <text class="value" x="214" y="4" text-anchor="end">3.2%</text>
    </g>
    <g transform="translate(252 105)">
      <circle cx="5" cy="0" r="4" fill="#f1e05a"/>
      <text class="label" x="16" y="4">JavaScript</text>
      <text class="value" x="212" y="4" text-anchor="end">2.6%</text>
    </g>

    <g transform="translate(0 130)">
      <circle cx="5" cy="0" r="4" fill="#b07219"/>
      <text class="label" x="16" y="4">Java</text>
      <text class="value" x="214" y="4" text-anchor="end">2.5%</text>
    </g>
    <g transform="translate(252 130)">
      <circle cx="5" cy="0" r="4" fill="#8b949e"/>
      <text class="label" x="16" y="4">Other</text>
      <text class="value" x="212" y="4" text-anchor="end">5.7%</text>
    </g>
  </g>

  <line x1="18" y1="224" x2="462" y2="224" stroke="#d8dee4"/>

  <g transform="translate(18 243)">
    <text class="eyebrow" x="0" y="0">CODE CHANGES</text>
    <text class="muted" x="0" y="17">44 original repositories · 40 repositories touched</text>

    <g transform="translate(0 31)">
      <rect width="214" height="57" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
      <text class="metric-label" x="13" y="19">LINES ADDED</text>
      <text class="metric-value added" x="13" y="43">+341,758</text>
    </g>
    <g transform="translate(230 31)">
      <rect width="214" height="57" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
      <text class="metric-label" x="13" y="19">LINES DELETED</text>
      <text class="metric-value deleted" x="13" y="43">−154,615</text>
    </g>
    <g transform="translate(0 98)">
      <rect width="214" height="57" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
      <text class="metric-label" x="13" y="19">COMMITS</text>
      <text class="metric-value" x="13" y="43">1,065</text>
    </g>
    <g transform="translate(230 98)">
      <rect width="214" height="57" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
      <text class="metric-label" x="13" y="19">ACTIVE REPOSITORIES</text>
      <text class="metric-value" x="13" y="43">40</text>
    </g>
  </g>
</svg>
